<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMİ7XL - İçerikler Yönetimi</title>
  <link rel="stylesheet" href="style.css?v=1.1">
  <link rel="icon" href="favicon.png?v=2">
</head>
<body style="background: #0b0b0b; color: #fff; display: flex; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <!-- SOL YÖNETİM MENÜSÜ -->
  <aside style="width: 260px; background: #111; border-right: 1px solid #222; padding: 25px 15px; display: flex; flex-direction: column; box-sizing: border-box;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="color: #c084fc; font-size: 1.3rem; margin: 0 0 5px 0;">👑 RUMİ7XL</h2>
      <span style="color: #777; font-size: 0.8rem;">Yönetici Paneli</span>
    </div>

    <nav class="admin-nav" style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
      <a href="admin.html" style="display: flex; align-items: center; gap: 10px; background: #141414; color: #ccc; border: 1px solid #222; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">📊 İstatistikler</a>
      <a href="admin.html" style="display: flex; align-items: center; gap: 10px; background: #141414; color: #ccc; border: 1px solid #222; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">📢 Duyuru Paylaş</a>
      <a href="admin.html" style="display: flex; align-items: center; gap: 10px; background: #141414; color: #ccc; border: 1px solid #222; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 0.95rem;">💬 Sohbet Yönetimi</a>
    </nav>

    <a href="index.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #ef4444; color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: auto; font-size: 0.95rem;">🏠 Siteye Dön</a>
  </aside>

  <!-- ANA İÇERİK ALANI -->
  <main style="flex: 1; padding: 40px; overflow-y: auto; box-sizing: border-box;">
    <div style="background: #141414; border: 1px solid #333; padding: 35px; border-radius: 16px; color: #fff; max-width: 900px; margin: 0 auto; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px;">
        <h2 style="color: #c084fc; margin: 0; font-size: 1.5rem;">🎬 İçerikler Sayfası Yönetim Paneli</h2>
        <a href="admin.html" style="background: #222; color: #aaa; border: 1px solid #444; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.9rem;">← Panellere Dön</a>
      </div>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 25px;">
        
        <!-- Canlı Durum Ayarları -->
        <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a;">
          <h4 style="color: #22c55e; margin-bottom: 15px; font-size: 1.1rem;">🔴 Canlı Yayın Durumu Kutusu</h4>
          <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer;">
            <input type="checkbox" id="admIsLive" style="width: 20px; height: 20px; cursor: pointer;">
            <span style="font-weight: bold; font-size: 1rem;">Şu Anda Yayında mı?</span>
          </label>
          <div style="margin-bottom: 12px;">
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Oynanan Oyun:</label>
            <input type="text" id="admLiveGame" style="width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          </div>
          <div>
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">İzleyici Sayısı:</label>
            <input type="text" id="admLiveViewers" style="width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          </div>
        </div>

        <!-- Kick, TikTok & Açıklama Ayarları -->
        <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a;">
          <h4 style="color: #22c55e; margin-bottom: 15px; font-size: 1.1rem;">🎮 Kick & 📱 TikTok Kutuları</h4>
          <div style="margin-bottom: 12px;">
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Kanal Linki (Kick):</label>
            <input type="text" id="admKickLink" style="width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          </div>
          <div style="margin-bottom: 12px;">
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Kick Oyun Listesi / Açıklama:</label>
            <textarea id="admKickDesc" rows="3" style="width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; resize: vertical; box-sizing: border-box;"></textarea>
          </div>
          <div>
            <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">TikTok Linki:</label>
            <input type="text" id="admTiktokLink" style="width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          </div>
        </div>

      </div>

      <!-- YouTube Video Listesi Yönetimi -->
      <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; margin-bottom: 25px;">
        <h4 style="color: #ef4444; margin-bottom: 15px; font-size: 1.1rem;">🎬 YouTube Videoları Ekle / Yönet (Liste Şeklinde)</h4>
        <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
          <input type="text" id="admNewYtTitle" placeholder="Video Başlığı (Örn: Minecraft Serisi #1)" style="flex: 2; min-width: 200px; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          <input type="text" id="admNewYtUrl" placeholder="Video Linki (https://youtube.com/...)" style="flex: 3; min-width: 220px; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;">
          <button id="addYtBtn" style="background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Ekle</button>
        </div>
        <div id="admYtVideoListContainer" style="max-height: 180px; overflow-y: auto; background: #111; padding: 12px; border-radius: 8px;">
          <p style="color: #777; font-size: 0.9rem; margin: 0; text-align: center;">Yükleniyor...</p>
        </div>
      </div>

      <button id="saveChangesBtn" style="background: #9146ff; color: #fff; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1.1rem; width: 100%;">Değişiklikleri Kaydet ve Yayınla 🚀</button>
    </div>
  </main>

  <div id="customToast"></div>

  <!-- FIREBASE & YÖNETİM SCRIPTİ -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCiuXtHu3J9Va46a4KiETO2JrSn5um2KoQ",
      authDomain: "rumi7xl-web.firebaseapp.com",
      projectId: "rumi7xl-web",
      storageBucket: "rumi7xl-web.firebasestorage.app",
      messagingSenderId: "1077565304835",
      appId: "1:1077565304835:web:a672a4440797b76f42de36"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_EMAIL = "rumi7xl@gmail.com";

    let adminYoutubeVideosCache = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user || user.email !== ADMIN_EMAIL) {
        showToast("Yetkisiz giriş!", "error");
        setTimeout(() => { window.location.href = "index.html"; }, 1000);
      } else {
        await loadConfigData();
      }
    });

    function showToast(message, type = 'success') {
      let toast = document.getElementById("customToast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "customToast";
        toast.style.cssText = `
          position: fixed; top: 25px; left: 50%; transform: translateX(-50%) translateY(-20px);
          background: #111; color: #fff; border: 1px solid ${type === 'error' ? '#ef4444' : '#9146ff'};
          padding: 14px 28px; border-radius: 14px; box-shadow: 0 0 30px rgba(145, 70, 255, 0.5);
          z-index: 999999; font-size: 1rem; font-weight: bold; display: flex; align-items: center; gap: 12px;
          transition: all 0.3s ease; opacity: 0;
        `;
        document.body.appendChild(toast);
      }
      toast.innerHTML = (type === 'error' ? '❌ ' : '✨ ') + message;
      toast.style.opacity = "1";
      toast.style.transform = "translateX(-50%) translateY(0)";
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(-20px)";
      }, 3000);
    }

    async function loadConfigData() {
      try {
        const docSnap = await getDoc(doc(db, "siteSettings", "iceriklerConfig"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById("admIsLive").checked = data.isLive || false;
          document.getElementById("admLiveGame").value = data.liveGame || "";
          document.getElementById("admLiveViewers").value = data.liveViewers || "0";
          document.getElementById("admKickLink").value = data.kickLink || "";
          document.getElementById("admKickDesc").value = data.kickDesc || "";
          document.getElementById("admTiktokLink").value = data.tiktokLink || "";
          adminYoutubeVideosCache = data.youtubeVideos || [];
        }
        renderYtList();
      } catch (e) {
        showToast("Veriler yüklenirken hata oluştu!", "error");
      }
    }

    function renderYtList() {
      const container = document.getElementById("admYtVideoListContainer");
      if (adminYoutubeVideosCache.length === 0) {
        container.innerHTML = `<p style="color: #777; font-size: 0.9rem; margin: 0; text-align: center;">Henüz video eklenmedi.</p>`;
        return;
      }
      let html = "";
      adminYoutubeVideosCache.forEach((vid, index) => {
        html += `
          <div style="display: flex; justify-content: space-between; align-items: center; background: #1c1c1c; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px;">
            <span style="color: #fff; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 15px;">▶ ${vid.title}</span>
            <button onclick="window.removeYt(${index})" style="background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Sil</button>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    document.getElementById("addYtBtn").onclick = () => {
      const titleInput = document.getElementById("admNewYtTitle");
      const urlInput = document.getElementById("admNewYtUrl");
      const title = titleInput.value.trim();
      const url = urlInput.value.trim();
      if (!title || !url) {
        showToast("Video başlığı ve linki boş olamaz kanka!", "error");
        return;
      }
      adminYoutubeVideosCache.push({ title, url });
      titleInput.value = "";
      urlInput.value = "";
      renderYtList();
    };

    window.removeYt = function(index) {
      adminYoutubeVideosCache.splice(index, 1);
      renderYtList();
    };

    document.getElementById("saveChangesBtn").onclick = async () => {
      try {
        const isLive = document.getElementById("admIsLive").checked;
        const liveGame = document.getElementById("admLiveGame").value.trim();
        const liveViewers = document.getElementById("admLiveViewers").value.trim();
        const kickLink = document.getElementById("admKickLink").value.trim();
        const kickDesc = document.getElementById("admKickDesc").value.trim();
        const tiktokLink = document.getElementById("admTiktokLink").value.trim();

        await setDoc(doc(db, "siteSettings", "iceriklerConfig"), {
          isLive, liveGame, liveViewers, kickLink, kickDesc,
          youtubeVideos: adminYoutubeVideosCache,
          tiktokLink,
          tiktokDesc: "En komik kesitler ve kısa videolar TikTok adresimde!"
        }, { merge: true });

        showToast("İçerikler sayfası başarıyla güncellendi! 🔥");
      } catch (e) {
        showToast("Kaydedilirken hata oluştu!", "error");
      }
    };
  </script>
</body>
</html>
