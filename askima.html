<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doğum Günün Kutlu Olsun Aşkım ❤️</title>
  <style>
    body { 
        background-color: #0c0c10; 
        color: #fff; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        padding: 60px 20px; 
        text-align: center; 
    }
    
    h1 { 
        color: #c084fc; 
        font-size: 3.5rem; 
        margin-bottom: 20px; 
        text-shadow: 0 0 20px rgba(192,132,252,0.6); 
        text-transform: uppercase;
    }
    
    h2 { 
        color: #ddd; 
        font-size: 1.6rem; 
        margin-bottom: 30px; 
        font-weight: 400; 
        max-width: 800px; 
        margin-left: auto; 
        margin-right: auto;
    }

    /* Sayaç Stili */
    .counter-container { margin-bottom: 50px; display: flex; justify-content: center; gap: 20px; }
    .c-box { background: #1c1c24; padding: 15px 25px; border-radius: 15px; border: 1px solid #c084fc; }
    .c-val { font-size: 1.8rem; font-weight: bold; color: #fff; display: block; }
    .c-lbl { font-size: 0.8rem; color: #c084fc; text-transform: uppercase; }

    /* Fotoğraf Galerisi: Çapraz ve Büyük */
    .photo-grid { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 40px; 
        max-width: 1100px; 
        margin: 0 auto; 
    }
    
    .photo-item { 
        width: 320px; 
        height: 320px; 
        border: 8px solid #fff; 
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        transition: transform 0.4s ease, z-index 0.4s ease;
        overflow: hidden;
        background: #222;
    }
    
    .photo-item:nth-child(odd) { transform: rotate(-6deg); }
    .photo-item:nth-child(even) { transform: rotate(6deg); }
    
    .photo-item:hover { 
        transform: rotate(0deg) scale(1.1); 
        z-index: 10; 
        border-color: #c084fc;
    }
    
    .photo-item img { width: 100%; height: 100%; object-fit: cover; }

    .back-btn { 
        margin-top: 80px; 
        padding: 15px 30px; 
        background: #9146ff; 
        color: #fff; 
        border: none; 
        border-radius: 50px; 
        cursor: pointer; 
        font-size: 1rem;
        transition: background 0.3s;
    }
    
    .back-btn:hover { background: #772ce8; }
  </style>
</head>
<body>

  <h1>DOĞUM GÜNÜN KUTLU OLSUN AŞKIM ❤️</h1>
  <h2>SENİNLE GEÇEN HER ANIM ÇOK GÜZEL İYİKİ VARSIN AŞKIM İYİKİ DOĞMUŞSUN BİR ÖMÜR BOYU BİRLİKTE SEVGİLİM SENİ ÇOK SEVİYORUM</h2>

  <!-- Sayaç Alanı -->
  <div class="counter-container">
    <div class="c-box"><span class="c-val" id="days">0</span><span class="c-lbl">Gün</span></div>
    <div class="c-box"><span class="c-val" id="hours">0</span><span class="c-lbl">Saat</span></div>
    <div class="c-box"><span class="c-val" id="minutes">0</span><span class="c-lbl">Dakika</span></div>
    <div class="c-box"><span class="c-val" id="seconds">0</span><span class="c-lbl">Saniye</span></div>
  </div>

  <div class="photo-grid">
    <div class="photo-item"><img src="fotograflar/1 (1).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (2).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (3).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (4).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (5).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (6).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (7).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (8).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (9).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (10).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (11).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (12).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (13).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (14).jpeg"></div>
  </div>

  <br><br>
  <button class="back-btn" onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

  <script>
    // 14 Eylül 2025 tarihi için sayaç
    const startDate = new Date(2025, 8, 14, 0, 0, 0); 

    function updateCounter() {
      const now = new Date();
      const diff = now - startDate;
      if (diff < 0) return;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    }
    setInterval(updateCounter, 1000);
    updateCounter();
  </script>
</body>
</html>
