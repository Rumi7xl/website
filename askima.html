<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doğum Günün Kutlu Olsun Aşkım ❤️</title>
  <style>
    body { 
        background-color: #0c0c10; 
        color: #fff; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        padding: 60px 20px; 
        text-align: center; 
    }
    
    h1 { 
        color: #c084fc; 
        font-size: 3.5rem; 
        margin-bottom: 20px; 
        text-shadow: 0 0 20px rgba(192,132,252,0.6); 
        text-transform: uppercase;
    }
    
    h2 { 
        color: #ddd; 
        font-size: 1.6rem; 
        margin-bottom: 70px; 
        font-weight: 400; 
        max-width: 800px; 
        margin-left: auto; 
        margin-right: auto;
    }

    /* Fotoğraf Galerisi: Çapraz ve Büyük */
    .photo-grid { 
        display: flex; 
        flex-wrap: wrap; 
        justify-content: center; 
        gap: 40px; 
        max-width: 1100px; 
        margin: 0 auto; 
    }
    
    .photo-item { 
        width: 320px; 
        height: 320px; 
        border: 8px solid #fff; 
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        transition: transform 0.4s ease, z-index 0.4s ease;
        overflow: hidden;
        background: #222;
    }
    
    /* Çapraz efekt */
    .photo-item:nth-child(odd) { transform: rotate(-6deg); }
    .photo-item:nth-child(even) { transform: rotate(6deg); }
    
    .photo-item:hover { 
        transform: rotate(0deg) scale(1.1); 
        z-index: 10; 
        border-color: #c084fc;
    }
    
    .photo-item img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
    }

    .back-btn { 
        margin-top: 80px; 
        padding: 15px 30px; 
        background: #9146ff; 
        color: #fff; 
        border: none; 
        border-radius: 50px; 
        cursor: pointer; 
        font-size: 1rem;
        transition: background 0.3s;
    }
    
    .back-btn:hover { background: #772ce8; }
  </style>
</head>
<body>

  <h1>DOĞUM GÜNÜN KUTLU OLSUN AŞKIM ❤️</h1>
  <h2>SENİNLE GEÇEN HER ANIM ÇOK GÜZEL İYİKİ VARSIN AŞKIM İYİKİ DOĞMUŞSUN BİR ÖMÜR BOYU BİRLİKTE SEVGİLİM</h2>

  <div class="photo-grid">
    <!-- 14 FOTOĞRAF -->
    <div class="photo-item"><img src="fotograflar/1 (1).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (2).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (3).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (4).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (5).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (6).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (7).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (8).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (9).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (10).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (11).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (12).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (13).jpeg"></div>
    <div class="photo-item"><img src="fotograflar/1 (14).jpeg"></div>
  </div>

  <br><br>
  <button class="back-btn" onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

</body>
</html>
