<div class="account-modal" id="accountModal">
<div class="account-window">
<button class="close-account" onclick="closeAccount()">✕</button>

<div class="account-tabs">
<button id="loginTab" class="active" onclick="showLogin()">Giriş Yap</button>
<button id="registerTab" onclick="showRegister()">Kayıt Ol</button>
</div>

<form id="loginForm" class="account-form" autocomplete="on">
<input type="email" name="email" placeholder="E-posta" autocomplete="email">
<input type="password" name="password" placeholder="Şifre" autocomplete="current-password">
<button type="button" class="account-submit">Giriş Yap</button>
</form>

<div id="registerForm" class="account-form" style="display:none;">
<input type="text" name="username" placeholder="Kullanıcı adı" autocomplete="username">
<input type="email" placeholder="E-posta" autocomplete="email">
<input type="password" placeholder="Şifre" autocomplete="new-password">
<button type="button" class="account-submit">Kayıt Ol</button>
</div>

</div>
</div>

<script>
const modal=document.getElementById("accountModal");

document.querySelector(".login-btn").onclick=(e)=>{
e.preventDefault();
showLogin();
modal.style.display="flex";
};

document.querySelector(".register-btn").onclick=(e)=>{
e.preventDefault();
showRegister();
modal.style.display="flex";
};

function showLogin(){

loginForm.style.display="flex";
registerForm.style.display="none";

document.getElementById("loginTab").classList.add("active");
document.getElementById("registerTab").classList.remove("active");

}

function showRegister(){

loginForm.style.display="none";
registerForm.style.display="flex";

document.getElementById("registerTab").classList.add("active");
document.getElementById("loginTab").classList.remove("active");

}

function closeAccount(){
modal.style.display="none";
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const app=initializeApp({
apiKey:"AIzaSyCiuXtHu3J9Va46a4KiETO2Jr5num2KoQ",
authDomain:"rumi7xl-web.firebaseapp.com",
projectId:"rumi7xl-web",
storageBucket:"rumi7xl-web.firebasestorage.app",
messagingSenderId:"1077565304835",
appId:"1:1077565304835:web:a672a4440797b76f42de36"
});

const auth=getAuth(app);

document.querySelector("#loginForm .account-submit").onclick=async()=>{
let i=document.querySelectorAll("#loginForm input");

try{
await signInWithEmailAndPassword(auth,i[0].value,i[1].value);
alert("Giriş başarılı");
closeAccount();
location.reload();
}catch(e){
alert(e.message);
}

};

document.querySelector("#registerForm .account-submit").onclick=async()=>{
let i=document.querySelectorAll("#registerForm input");

try{
await createUserWithEmailAndPassword(auth,i[1].value,i[2].value);
alert("Hesap oluşturuldu");
location.reload();
}catch(e){
alert(e.message);
}

};

onAuthStateChanged(auth,(user)=>{

const box=document.querySelector(".account-box");

if(user && box){

box.innerHTML=`
<a>👤 ${user.email.split("@")[0]}</a>
<a href="#" id="logoutBtn">🚪 Çıkış Yap</a>
`;

document.getElementById("logoutBtn").onclick=(e)=>{
e.preventDefault();
signOut(auth).then(()=>location.reload());
};

}

});

</script>
