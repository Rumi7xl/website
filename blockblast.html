<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RUMİ7XL - Block Blast</title>
  <link href="favicon.png?v=2" rel="icon" type="image/png"/>
  <link rel="stylesheet" href="style.css?v=1.2">
  <style>
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }
    .score-board {
      font-size: 20px;
      font-weight: bold;
      color: #53fc18;
      text-shadow: 0 0 10px rgba(83, 252, 24, 0.5);
    }
    /* 8x8 Oyun Tahtası */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(8, 42px);
      grid-template-rows: repeat(8, 42px);
      gap: 3px;
      background: #0a0a0a;
      padding: 8px;
      border: 2px solid #53fc18;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(83, 252, 24, 0.25);
    }
    .cell {
      width: 42px;
      height: 42px;
      background: #181818;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .cell.filled {
      background: #53fc18;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }
    .cell.highlight {
      background: rgba(83, 252, 24, 0.4);
    }
    /* Alt Şekil Seçim Alanı */
    .pieces-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background: #111;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 15px 20px;
      min-height: 110px;
      width: 360px;
      box-sizing: border-box;
    }
    .piece-box {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      background: #161616;
      border: 1px solid #282828;
      border-radius: 10px;
      touch-action: none;
    }
    .piece-box:active {
      cursor: grabbing;
    }
    .mini-grid {
      display: grid;
      gap: 2px;
    }
    .mini-cell {
      width: 16px;
      height: 16px;
      background: #252525;
      border-radius: 3px;
    }
    .mini-cell.filled {
      background: #53fc18;
    }
    /* Oyun Bitti Ekranı */
    #gameOverScreen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="oyunlar.html" class="logo" style="font-size: 20px;">← Oyunlara Dön</a>
    <div class="nav-links">
      <span style="color: #53fc18; font-weight: bold; font-size: 18px;">🧩 Block Blast</span>
    </div>
    <div class="account-box"></div>
  </nav>

  <div style="max-width: 500px; margin: 20px auto; padding: 0 20px; text-align: center; position: relative;">
    
    <div class="game-wrapper">
      <div class="score-board">Skor: <span id="currentScore">0</span></div>

      <!-- Ana Oyun Alanı -->
      <div style="position: relative;">
        <div id="gridBoard" class="grid-board"></div>
        
        <!-- Game Over Modalı -->
        <div id="gameOverScreen">
          <h2 style="color: #ef4444; font-size: 28px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(239,68,68,0.5);">Oyun Bitti!</h2>
          <p style="color: #aaa; margin-bottom: 20px; font-size: 16px;">Toplam Skorun: <span id="finalScore" style="color:white; font-weight:bold;">0</span></p>
          <button onclick="resetGame()" style="background: #53fc18; color: black; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(83,252,24,0.4);">Tekrar Oyna</button>
        </div>
      </div>

      <!-- Parçaların Çıkacağı Alan -->
      <div id="piecesContainer" class="pieces-container"></div>
    </div>

  </div>

  <footer>
    <p>© 2026 RUMİ7XL - Tüm Hakları Saklıdır.</p>
  </footer>

  <script>
    const BOARD_SIZE = 8;
    let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
    let score = 0;
    let currentPieces = [null, null, null];

    // Farklı blok şekilleri (Matrixleri)
    const SHAPES = [
      [[1]], // Tekli kare
      [[1, 1]], // 2'li yatay
      [[1], [1]], // 2'li dikey
      [[1, 1], [1, 1]], // 2x2 Kare
      [[1, 1, 1]], // 3'lü yatay
      [[1], [1], [1]], // 3'lü dikey
      [[1, 1], [1, 0]], // L şekli küçük
      [[1, 1, 1], [1, 0, 0]] // L şekli büyük
    ];

    const gridBoard = document.getElementById("gridBoard");
    const piecesContainer = document.getElementById("piecesContainer");
    const currentScoreEl = document.getElementById("currentScore");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScoreEl = document.getElementById("finalScore");

    // Tahtayı HTML'e çiz
    function initBoardUI() {
      gridBoard.innerHTML = "";
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          cell.dataset.row = r;
          cell.dataset.col = c;
          gridBoard.appendChild(cell);
        }
      }
    }

    // Yeni 3 rastgele blok üret
    function generatePieces() {
      currentPieces = [];
      piecesContainer.innerHTML = "";
      
      for (let i = 0; i < 3; i++) {
        const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        currentPieces.push(randomShape);
        
        const pieceBox = document.createElement("div");
        pieceBox.classList.add("piece-box");
        pieceBox.dataset.index = i;

        const rows = randomShape.length;
        const cols = randomShape[0].length;

        const miniGrid = document.createElement("div");
        miniGrid.classList.add("mini-grid");
        miniGrid.style.gridTemplateColumns = `repeat(${cols}, 16px)`;
        miniGrid.style.gridTemplateRows = `repeat(${rows}, 16px)`;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const miniCell = document.createElement("div");
            miniCell.classList.add("mini-cell");
            if (randomShape[r][c] === 1) {
              miniCell.classList.add("filled");
            }
            miniGrid.appendChild(miniCell);
          }
        }

        pieceBox.appendChild(miniGrid);
        
        // Sürükleme / Tıklama Etkinlikleri
        makeDraggable(pieceBox, i);
        piecesContainer.appendChild(pieceBox);
      }

      checkGameOver();
    }

    // Basit ve akıcı tıklama / bırakma mantığı
    let selectedPieceIndex = null;

    function makeDraggable(element, index) {
      element.addEventListener("click", () => {
        // Önceki seçimi kaldır
        document.querySelectorAll(".piece-box").forEach(b => b.style.borderColor = "#282828");
        
        if (selectedPieceIndex === index) {
          selectedPieceIndex = null;
        } else {
          selectedPieceIndex = index;
          element.style.borderColor = "#53fc18";
        }
      });
    }

    // Tahtaya tıklandığında seçilen bloğu yerleştir
    gridBoard.addEventListener("click", (e) => {
      if (selectedPieceIndex === null) return;
      const cell = e.target.closest(".cell");
      if (!cell) return;

      const targetR = parseInt(cell.dataset.row);
      const targetC = parseInt(cell.dataset.col);
      const shape = currentPieces[selectedPieceIndex];

      if (!shape) return;

      if (canPlace(shape, targetR, targetC)) {
        placeShape(shape, targetR, targetC);
        currentPieces[selectedPieceIndex] = null;
        
        // Parçayı kutudan sil
        const box = document.querySelector(`.piece-box[data-index="${selectedPieceIndex}"]`);
        if (box) box.innerHTML = "";
        
        selectedPieceIndex = null;
        checkLines();

        // Eğer 3 parça da bittiyse yeni 3'lü getir
        if (currentPieces.every(p => p === null)) {
          generatePieces();
        } else {
          checkGameOver();
        }
      }
    });

    function canPlace(shape, r, c) {
      const rows = shape.length;
      const cols = shape[0].length;
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          if (shape[i][j] === 1) {
            let nr = r + i;
            let nc = c + j;
            if (nr >= BOARD_SIZE || nc >= BOARD_SIZE || board[nr][nc] === 1) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function placeShape(shape, r, c) {
      const rows = shape.length;
      const cols = shape[0].length;
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          if (shape[i][j] === 1) {
            board[r + i][c + j] = 1;
            score += 2;
          }
        }
      }
      updateBoardUI();
      updateScore();
    }

    function updateBoardUI() {
      const cells = gridBoard.children;
      let idx = 0;
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === 1) {
            cells[idx].classList.add("filled");
          } else {
            cells[idx].classList.remove("filled");
          }
          idx++;
        }
      }
    }

    // Dolan satır ve sütunları patlatma kontrolü
    function checkLines() {
      let rowsToClear = [];
      let colsToClear = [];

      for (let r = 0; r < BOARD_SIZE; r++) {
        if (board[r].every(cell => cell === 1)) {
          rowsToClear.push(r);
        }
      }

      for (let c = 0; c < BOARD_SIZE; c++) {
        let colFilled = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
          if (board[r][c] === 0) colFilled = false;
        }
        if (colFilled) colsToClear.push(c);
      }

      if (rowsToClear.length > 0 || colsToClear.length > 0) {
        rowsToClear.forEach(r => {
          for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
          score += 20;
        });

        colsToClear.forEach(c => {
          for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
          score += 20;
        });

        updateBoardUI();
        updateScore();
      }
    }

    function updateScore() {
      currentScoreEl.innerText = score;
    }

    // Oyun bitti mi kontrolü (Eldeki kalan şekillerden hiçbiri tahtaya sığmıyor mu?)
    function checkGameOver() {
      const remainingPieces = currentPieces.filter(p => p !== null);
      if (remainingPieces.length === 0) return;

      let possibleMoveExists = false;
      for (let piece of remainingPieces) {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (canPlace(piece, r, c)) {
              possibleMoveExists = true;
              break;
            }
          }
          if (possibleMoveExists) break;
        }
        if (possibleMoveExists) break;
      }

      if (!possibleMoveExists) {
        finalScoreEl.innerText = score;
        gameOverScreen.style.display = "flex";
      }
    }

    function resetGame() {
      board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
      score = 0;
      updateScore();
      gameOverScreen.style.display = "none";
      updateBoardUI();
      generatePieces();
    }

    // Oyunu Başlat
    initBoardUI();
    generatePieces();
  </script>

  <script type="module" src="auth.js?v=1.2"></script>
</body>
</html>
