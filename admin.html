<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMİ7XL - Yönetici Paneli</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin Paneline Özel Ek Stiller */
    body { background-color: #050505; }
    .admin-container { display: flex; min-height: 100vh; }
    
    /* Sol Menü */
    .admin-sidebar { width: 250px; background: #0a0a0a; border-right: 1px solid #222; padding: 20px; }
    .admin-sidebar h2 { color: #9146ff; text-align: center; margin-bottom: 30px; font-size: 24px; text-shadow: 0 0 10px #9146ff; }
    .admin-menu { display: flex; flex-direction: column; gap: 10px; }
    .admin-menu button { background: #111; color: #ddd; border: 1px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 16px; text-align: left; }
    .admin-menu button:hover, .admin-menu button.active { background: #9146ff; color: white; border-color: #9146ff; box-shadow: 0 0 15px rgba(145, 70, 255, 0.4); }
    
    /* Sağ İçerik Alanı */
    .admin-content { flex: 1; padding: 40px; }
    .admin-section { display: none; background: #111; border: 1px solid #222; border-radius: 15px; padding: 30px; }
    .admin-section.active { display: block; }
    
    /* İstatistik Kartları */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(145deg, #181818, #0a0a0a); border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; }
    .stat-card h3 { color: #aaa; font-size: 16px; margin-bottom: 10px; }
    .stat-card p { color: #9146ff; font-size: 36px; font-weight: bold; margin: 0; }
    
    /* Form Elemanları */
    .admin-form input, .admin-form textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-family: inherit; resize: vertical; }
    .admin-btn { background: #9146ff; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .admin-btn:hover { background: #7a35e6; box-shadow: 0 0 15px rgba(145, 70, 255, 0.5); }
    
    /* Moderasyon Tablosu */
    .mod-list { display: flex; flex-direction: column; gap: 10px; }
    .mod-item { display: flex; justify-content: space-between; align-items: center; background: #0a0a0a; border: 1px solid #333; padding: 15px; border-radius: 10px; }
    .mod-item .text { color: #ddd; }
    .mod-item .delete-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- SOL MENÜ -->
    <div class="admin-sidebar">
      <h2>👑 RUMİ7XL<br><span style="font-size: 14px; color: #aaa;">Yönetici Paneli</span></h2>
      <div class="admin-menu">
        <button class="tab-btn active" onclick="switchAdminTab('dashboard')">📊 İstatistikler</button>
        <button class="tab-btn" onclick="switchAdminTab('announcements')">📢 Duyuru Paylaş</button>
        <button class="tab-btn" onclick="switchAdminTab('moderation')">🛡️ Sohbet Yönetimi</button>
        <button class="tab-btn" style="margin-top: 50px; background: #ef4444; border-color: #ef4444; text-align: center;" onclick="window.location.href='index.html'">🏠 Siteye Dön</button>
      </div>
    </div>

    <!-- SAĞ İÇERİK -->
    <div class="admin-content">
      
      <!-- 1. İSTATİSTİKLER -->
      <div id="dashboard" class="admin-section active">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Sitenin Genel Durumu</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Toplam Kayıtlı Üye</h3>
            <p id="totalUsers">0</p>
          </div>
          <div class="stat-card">
            <h3>Aktif Kullanıcılar</h3>
            <p id="activeUsers">0</p>
          </div>
          <div class="stat-card">
            <h3>Toplam Duyuru</h3>
            <p id="totalAnnouncements">0</p>
          </div>
        </div>
      </div>

      <!-- 2. DUYURU PAYLAŞMA -->
      <div id="announcements" class="admin-section">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Yeni Duyuru Oluştur</h2>
        <div class="admin-form">
          <input type="text" id="announceTitle" placeholder="Duyuru Başlığı (Örn: 🔥 Hoş Geldiniz)">
          <textarea id="announceDesc" rows="4" placeholder="Duyuru İçeriğini Buraya Yaz..."></textarea>
          <button class="admin-btn" id="sendAnnounceBtn">Duyuruyu Yayınla</button>
        </div>
      </div>

      <!-- 3. SOHBET YÖNETİMİ -->
      <div id="moderation" class="admin-section">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Topluluk Mesajları (Moderasyon)</h2>
        <div class="mod-list" id="adminChatList">
          <p style="color: #aaa;">Mesajlar yükleniyor...</p>
          <!-- Örnek görünüm için statik bir mesaj (veritabanı bağlanınca bunlar dinamik olacak) -->
          <div class="mod-item">
            <div class="text"><strong>Kullanici1:</strong> Selam abi yayın ne zaman?</div>
            <button class="delete-btn">Sil</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Tab Değiştirme Mantığı
    function switchAdminTab(tabId) {
      // Tüm sekmeleri gizle
      document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      // Seçileni aktif et
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

  <!-- Burada Firebase bağlantı scriptimiz (admin.js) devreye girecek -->
  <!-- <script type="module" src="admin.js"></script> -->
</body>
</html>
