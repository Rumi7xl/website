<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>RUMİ7XL - Yönetici Paneli</title>
  <link rel="icon" href="favicon.png?v=2">
  <link href="style.css?v=1.1" rel="stylesheet"/>
  <style>
    body {
      background: #0b0b0b;
      color: #fff;
      display: flex;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    aside {
      width: 260px;
      background: #111;
      border-right: 1px solid #222;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }
    .admin-nav a, .admin-nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #141414;
      color: #ccc;
      border: 1px solid #222;
      padding: 12px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      text-align: left;
      box-sizing: border-box;
      transition: 0.2s;
    }
    .admin-nav a:hover, .admin-nav button:hover, .admin-nav a.active {
      background: #1f1424;
      border-color: #9146ff;
      color: #c084fc;
    }
    main {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .panel-section {
      display: none;
    }
    .panel-section.active {
      display: block;
    }
    .card {
      background: #141414;
      border: 1px solid #333;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 15px;
      font-size: 0.95rem;
    }
    .primary-btn {
      background: #9146ff;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.2s;
    }
    .primary-btn:hover {
      background: #772ce8;
    }
    .delete-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .announcement-card {
      display: flex;
      gap: 20px;
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      align-items: center;
    }
    .announcement-card img {
      width: 100px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }
    .announcement-info {
      flex: 1;
    }
    .announcement-info h3 {
      margin: 0 0 5px 0;
      color: #c084fc;
      font-size: 1.1rem;
    }
    .announcement-info p {
      margin: 0 0 8px 0;
      color: #aaa;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- SOL YÖNETİM MENÜSÜ -->
  <aside>
    <div style="text-align: center; margin-bottom: 30px;">
      <h2 style="color: #c084fc; font-size: 1.3rem; margin: 0 0 5px 0;">👑 RUMİ7XL</h2>
      <span style="color: #777; font-size: 0.8rem;">Yönetici Paneli</span>
    </div>

    <nav class="admin-nav" style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
      <button class="active" onclick="switchPanel('stats', this)">📊 İstatistikler</button>
      <button onclick="switchPanel('announce', this)">📢 Duyuru Paylaş</button>
      <button onclick="switchPanel('chat', this)">💬 Sohbet Yönetimi</button>
      <a href="admin-icerikler.html">🎬 İçerikler Yönetimi</a>
    </nav>

    <a href="index.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #ef4444; color: #fff; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: auto; font-size: 0.95rem;">🏠 Siteye Dön</a>
  </aside>

  <!-- ANA İÇERİK ALANI -->
  <main>
    
    <!-- 1. İSTATİSTİKLER SEKMESİ -->
    <div id="statsPanel" class="panel-section active">
      <div class="card">
        <h2 style="color: #c084fc; margin-top: 0;">📊 Site İstatistikleri</h2>
        <p style="color: #aaa;">Toplam Yayınlanan Duyuru Sayısı: <b id="totalAnnouncements" style="color: #22c55e;">0</b></p>
      </div>
    </div>

    <!-- 2. DUYURU PAYLAŞ SEKMESİ -->
    <div id="announcePanel" class="panel-section">
      <div class="card">
        <h2 style="color: #c084fc; margin-top: 0;" id="formTitleText">📢 Duyuru Paylaş / Düzenle</h2>
        <input type="hidden" id="editingId" value="">
        
        <label style="color: #aaa; font-size: 0.85rem; display: block; margin-bottom: 5px;">Duyuru Başlığı:</label>
        <input type="text" id="announceTitle" placeholder="Örn: Yeni Sezon Başlıyor!">
        
        <label style="color: #aaa; font-size: 0.85rem; display: block; margin-bottom: 5px;">Duyuru İçeriği:</label>
        <textarea id="announceDesc" rows="4" placeholder="Duyuru detaylarını buraya yaz..."></textarea>
        
        <label style="color: #aaa; font-size: 0.85rem; display: block; margin-bottom: 5px;">Görsel Ekle (İsteğe Bağlı):</label>
        <label for="announceImageFile" style="border: 2px dashed #333; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; display: block; background: #111; margin-bottom: 15px;">
          <span id="uploadLabelText" style="color: #aaa; font-size: 0.9rem;">📁 Fotoğraf seçmek için tıkla veya buraya yükle</span>
          <input type="file" id="announceImageFile" accept="image/*" style="display:none;">
          <div id="imagePreviewContainer" style="margin-top: 10px; display: none;">
            <img id="imagePreview" src="" style="max-height: 120px; border-radius: 8px;">
          </div>
        </label>

        <div style="display: flex; gap: 10px;">
          <button id="sendAnnounceBtn" class="primary-btn">Duyuruyu Yayınla</button>
          <button id="cancelEditBtn" style="background: #333; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: none;">İptal</button>
        </div>
      </div>

      <div class="card">
        <h3 style="color: #c084fc; margin-top: 0;">Yayınlanan Duyurular</h3>
        <div id="adminAnnouncementList">
          <p style="color: #aaa;">Duyurular yükleniyor...</p>
        </div>
      </div>
    </div>

    <!-- 3. SOHBET YÖNETİMİ SEKMESİ -->
    <div id="chatPanel" class="panel-section">
      <div class="card">
        <h2 style="color: #c084fc; margin-top: 0;">💬 Topluluk Sohbet Yönetimi</h2>
        <div id="adminChatList">
          <p style="color: #aaa;">Mesajlar yükleniyor...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- ONAY MODALI -->
  <div id="customConfirmModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:999999;">
    <div style="background:#181818; border:1px solid #9146ff; padding:25px; border-radius:16px; width:350px; text-align:center; color:#fff; box-shadow:0 0 30px rgba(145,70,255,0.4);">
      <h3 style="color:#c084fc; margin-bottom:10px;">Emin misin?</h3>
      <p id="confirmText" style="color:#aaa; font-size:0.95rem; margin-bottom:20px;"></p>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button id="confirmYesBtn" class="delete-btn" style="padding:8px 20px;">Evet</button>
        <button id="confirmNoBtn" style="background:#333; color:#fff; border:none; padding:8px 20px; border-radius:6px; cursor:pointer;">İptal</button>
      </div>
    </div>
  </div>

  <div id="customToast"></div>

  <!-- SEKME GEÇİŞLERİ İÇİN KÜÇÜK SCRIPT -->
  <script>
    function switchPanel(panelName, btnEl) {
      document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.admin-nav button').forEach(el => el.classList.remove('active'));

      if (panelName === 'stats') document.getElementById('statsPanel').classList.add('active');
      if (panelName === 'announce') document.getElementById('announcePanel').classList.add('active');
      if (panelName === 'chat') document.getElementById('chatPanel').classList.add('active');

      if (btnEl) btnEl.classList.add('active');
    }

    document.getElementById('announceImageFile').onchange = function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('uploadLabelText').innerText = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById('imagePreview').src = evt.target.result;
          document.getElementById('imagePreviewContainer').style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    };
  </script>

  <!-- YÖNETİM MANTIĞI BAĞLANTISI -->
  <script type="module" src="admin.js"></script>
</body>
</html>
