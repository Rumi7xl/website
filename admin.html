<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMİ7XL - Yönetici Paneli</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #050505; color: #fff; font-family: inherit; }
    .admin-container { display: flex; min-height: 100vh; }
    .admin-sidebar { width: 250px; background: #0a0a0a; border-right: 1px solid #222; padding: 20px; }
    .admin-sidebar h2 { color: #9146ff; text-align: center; margin-bottom: 30px; font-size: 24px; text-shadow: 0 0 10px #9146ff; }
    .admin-menu { display: flex; flex-direction: column; gap: 10px; }
    .admin-menu button { background: #111; color: #ddd; border: 1px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 16px; text-align: left; }
    .admin-menu button:hover, .admin-menu button.active { background: #9146ff; color: white; border-color: #9146ff; box-shadow: 0 0 15px rgba(145, 70, 255, 0.4); }
    .admin-content { flex: 1; padding: 40px; overflow-y: auto; max-height: 100vh; }
    .admin-section { display: none; background: #111; border: 1px solid #222; border-radius: 15px; padding: 30px; margin-bottom: 30px; }
    .admin-section.active { display: block; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(145deg, #181818, #0a0a0a); border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; }
    .stat-card h3 { color: #aaa; font-size: 16px; margin-bottom: 10px; }
    .stat-card p { color: #9146ff; font-size: 36px; font-weight: bold; margin: 0; }
    .admin-form input, .admin-form textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-family: inherit; resize: vertical; box-sizing: border-box; }
    .admin-btn { background: #9146ff; color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .admin-btn:hover { background: #7a35e6; box-shadow: 0 0 15px rgba(145, 70, 255, 0.5); }
    
    .emoji-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .emoji-btn { background: #1a1a1a; border: 1px solid #333; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
    .emoji-btn:hover { background: #9146ff; border-color: #9146ff; }
    
    .announcement-card { background: #181818; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; gap: 20px; align-items: flex-start; }
    .announcement-card img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #444; }
    .announcement-info { flex: 1; }
    .announcement-info h3 { color: #9146ff; margin-bottom: 8px; font-size: 1.2rem; }
    .announcement-info p { color: #ccc; font-size: 0.95rem; line-height: 1.4; margin-bottom: 12px; }
    .card-actions { display: flex; gap: 10px; }
    .edit-btn { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-sidebar">
      <h2>👑 RUMİ7XL<br><span style="font-size: 14px; color: #aaa;">Yönetici Paneli</span></h2>
      <div class="admin-menu">
        <button class="tab-btn" id="btn-dashboard" onclick="switchAdminTab('dashboard', this)">📊 İstatistikler</button>
        <button class="tab-btn" id="btn-announcements" onclick="switchAdminTab('announcements', this)">📢 Duyuru Paylaş</button>
        <button class="tab-btn" id="btn-moderation" onclick="switchAdminTab('moderation', this)">🛡️ Sohbet Yönetimi</button>
        <button class="tab-btn" style="margin-top: 50px; background: #ef4444; border-color: #ef4444; text-align: center;" onclick="window.location.href='index.html'">🏠 Siteye Dön</button>
      </div>
    </div>

    <div class="admin-content">
      
      <!-- 1. İSTATİSTİKLER -->
      <div id="dashboard" class="admin-section">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Sitenin Genel Durumu</h2>
        <div class="stats-grid">
          <div class="stat-card"><h3>Toplam Kayıtlı Üye</h3><p id="totalUsers">0</p></div>
          <div class="stat-card"><h3>Aktif Kullanıcılar</h3><p id="activeUsers">1 (Aktif)</p></div>
          <div class="stat-card"><h3>Toplam Duyuru</h3><p id="totalAnnouncements">0</p></div>
        </div>
      </div>

      <!-- 2. DUYURU PAYLAŞ & LİSTELEME -->
      <div id="announcements" class="admin-section">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Yeni Duyuru Oluştur</h2>
        <div class="admin-form">
          <input type="hidden" id="editingId" value="">
          <input type="text" id="announceTitle" placeholder="Duyuru Başlığı...">
          
          <div class="emoji-bar">
            <span style="font-size:0.85rem; color:#888; align-self:center; margin-right:5px;">Hızlı Emoji:</span>
            <button type="button" class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('🚀')">🚀</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('📢')">📢</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('✨')">✨</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('⭐')">⭐</button>
            <button type="button" class="emoji-btn" onclick="addEmoji('⚠️')">⚠️</button>
          </div>

          <textarea id="announceDesc" rows="4" placeholder="Duyuru İçeriğini Buraya Yaz..."></textarea>
          
          <label style="display:block; margin-bottom:8px; font-size:0.9rem; color:#aaa;">📷 Duyuru Fotoğrafı Seç (İsteğe bağlı):</label>
          <input type="file" id="announceImageFile" accept="image/*" style="padding: 10px; background: #050505;">
          
          <button class="admin-btn" id="sendAnnounceBtn">Duyuruyu Yayınla</button>
          <button class="admin-btn" id="cancelEditBtn" style="background:#444; display:none; margin-left:10px;">İptal</button>
        </div>

        <h3 style="color: #9146ff; margin-top: 40px; margin-bottom: 20px; border-top: 1px solid #222; padding-top: 20px;">📜 Yayınlanan Duyurular (Düzenle / Sil)</h3>
        <div id="adminAnnouncementList">
          <p style="color: #aaa;">Duyurular yükleniyor...</p>
        </div>
      </div>

      <!-- 3. SOHBET YÖNETİMİ -->
      <div id="moderation" class="admin-section">
        <h2 style="color: #9146ff; margin-bottom: 20px;">Topluluk Mesajları</h2>
        <div class="mod-list" id="adminChatList">
          <p style="color: #aaa;">Mesajlar yükleniyor...</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function switchAdminTab(tabId, btnElement) {
      document.querySelectorAll('.admin-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      const target = document.getElementById(tabId);
      if (target) target.classList.add('active');
      if (btnElement) btnElement.classList.add('active');
      
      // Hangi sekmede olduğunu hafızaya kaydet (F5 atınca sıfırlanmasın)
      localStorage.setItem("activeAdminTab", tabId);
    }

    // Sayfa açıldığında hafızadaki sekmeyi getir
    window.addEventListener("DOMContentLoaded", () => {
      const savedTab = localStorage.getItem("activeAdminTab") || "dashboard";
      const targetBtn = document.getElementById("btn-" + savedTab);
      if (targetBtn) {
        switchAdminTab(savedTab, targetBtn);
      } else {
        switchAdminTab("dashboard", document.getElementById("btn-dashboard"));
      }
    });

    function addEmoji(emoji) {
      const descInput = document.getElementById("announceDesc");
      descInput.value += emoji;
      descInput.focus();
    }
  </script>
  <script type="module" src="admin.js"></script>
</body>
</html>
