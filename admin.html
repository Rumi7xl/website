<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli</title>
  <style>
    /* Temel Karanlık Tema Tasarımı */
    body { background-color: #0f0f0f; color: #fff; font-family: sans-serif; margin: 0; display: flex; }
    .sidebar { width: 250px; background: #181818; padding: 20px; height: 100vh; box-sizing: border-box; border-right: 1px solid #2a2a2a; }
    .sidebar h1 { font-size: 1.5rem; color: #c084fc; margin-top: 0; }
    .sidebar button { display: block; width: 100%; background: transparent; color: #aaa; border: none; padding: 10px; text-align: left; cursor: pointer; font-size: 1rem; margin-bottom: 5px; border-radius: 5px; }
    .sidebar button:hover, .sidebar button.active { background: #2a2a2a; color: #fff; }
    .content { flex: 1; padding: 30px; box-sizing: border-box; overflow-y: auto; height: 100vh; }
    .panel-section { display: none; }
    .panel-section.active { display: block; }
    .card { background: #111; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; }
    input[type="text"] { width: 100%; padding: 10px; background: #181818; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
    .primary-btn { background: #c084fc; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
    .primary-btn:hover { background: #a855f7; }
  </style>
</head>
<body>

  <!-- YAN MENÜ -->
  <div class="sidebar">
    <h1>⚙️ Admin Panel</h1>
    <button onclick="openTab('dashboard')">1. Genel Durum</button>
    <button onclick="openTab('kullanicilar')">2. Kullanıcılar</button>
    <button onclick="openTab('ayarlar')">3. Ayarlar</button>
    <button onclick="openTab('iceriklerPanel')" class="active">4. İçerikler Yönetimi</button>
  </div>

  <!-- ANA İÇERİK -->
  <div class="content">
    
    <!-- 1. SEKME (Kendi kodlarını buraya ekleyebilirsin) -->
    <div id="dashboard" class="panel-section">
      <div class="card">
        <h2>Genel Durum</h2>
        <p>Burası dashboard bölümü.</p>
      </div>
    </div>

    <!-- 2. SEKME (Kendi kodlarını buraya ekleyebilirsin) -->
    <div id="kullanicilar" class="panel-section">
      <div class="card">
        <h2>Kullanıcılar</h2>
        <p>Kullanıcı yönetimi burada olacak.</p>
      </div>
    </div>

    <!-- 3. SEKME (Kendi kodlarını buraya ekleyebilirsin) -->
    <div id="ayarlar" class="panel-section">
      <div class="card">
        <h2>Ayarlar</h2>
        <p>Sistem ayarları burada olacak.</p>
      </div>
    </div>

    <!-- 4. İÇERİKLER YÖNETİMİ SEKMESİ (DÜZELTTİĞİMİZ KISIM) -->
    <div id="iceriklerPanel" class="panel-section active">
      <div class="card">
        <h2 style="color: #c084fc; margin-top: 0; margin-bottom: 25px;">🎬 İçerikler Sayfası Yönetim Paneli</h2>
        
        <!-- 3 Ayrı Kutu (Canlı Yayın, Kick, TikTok) -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px;">
          
          <!-- Canlı Yayın Kutusu -->
          <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a;">
            <h4 style="color: #22c55e; margin-bottom: 15px; font-size: 1.1rem;">🔴 Canlı Yayın Durumu</h4>
            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; cursor: pointer;">
              <input type="checkbox" id="admIsLive" style="width: 20px; height: 20px; cursor: pointer;">
              <span style="font-weight: bold; font-size: 1rem;">Şu Anda Yayında mı?</span>
            </label>
            <div style="margin-bottom: 12px;">
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Oynanan Oyun:</label>
              <input type="text" id="admLiveGame">
            </div>
            <div>
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">İzleyici Sayısı:</label>
              <input type="text" id="admLiveViewers">
            </div>
          </div>

          <!-- Kick Kutusu -->
          <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a;">
            <h4 style="color: #22c55e; margin-bottom: 15px; font-size: 1.1rem;">🎮 Kick Ayarları</h4>
            <div style="margin-bottom: 12px;">
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Kanal Linki (Kick):</label>
              <input type="text" id="admKickLink">
            </div>
            <div>
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">Kick Oyun Listesi / Açıklama:</label>
              <textarea id="admKickDesc" rows="4" style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; resize: vertical; box-sizing: border-box; font-size: 0.95rem;"></textarea>
            </div>
          </div>

          <!-- TikTok Kutusu -->
          <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a;">
            <h4 style="color: #22c55e; margin-bottom: 15px; font-size: 1.1rem;">📱 TikTok Ayarları</h4>
            <div style="margin-bottom: 12px;">
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">TikTok Linki:</label>
              <input type="text" id="admTiktokLink">
            </div>
            <div>
              <label style="font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 5px;">TikTok Açıklaması:</label>
              <textarea id="admTiktokDesc" rows="4" placeholder="En komik kesitler burada..." style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; resize: vertical; box-sizing: border-box; font-size: 0.95rem;"></textarea>
            </div>
          </div>

        </div>

        <!-- YouTube Video Listesi -->
        <div style="background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #2a2a2a; margin-bottom: 25px;">
          <h4 style="color: #ef4444; margin-bottom: 15px; font-size: 1.1rem;">🎬 YouTube Videoları Ekle / Yönet</h4>
          <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
            <input type="text" id="admNewYtTitle" placeholder="Video Başlığı" style="flex: 2; min-width: 200px; margin-bottom: 0;">
            <input type="text" id="admNewYtUrl" placeholder="Video Linki (https://youtube.com/...)" style="flex: 3; min-width: 220px; margin-bottom: 0;">
            <button id="addYtBtn" style="background: #ef4444; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;">Ekle</button>
          </div>
          <div id="admYtVideoListContainer" style="max-height: 180px; overflow-y: auto; background: #111; padding: 12px; border-radius: 8px; margin-top: 15px;">
            <p style="color: #777; font-size: 0.9rem; margin: 0; text-align: center;">Yükleniyor...</p>
          </div>
        </div>

        <button id="saveIceriklerBtn" class="primary-btn" style="width: 100%;">Değişiklikleri Kaydet ve Yayınla 🚀</button>
      </div>
    </div>

  </div>

  <!-- Sekme Değiştirme Scripti (Basit versiyon, kendi js dosyan varsa bunu silebilirsin) -->
  <script>
    function openTab(tabId) {
      document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.sidebar button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

  <!-- Senin Firebase/Veritabanı JS Dosyan -->
  <script src="admin.js"></script>
</body>
</html>
