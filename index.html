<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUMİ7XL | Resmi Web Sitesi</title>
<link href="style.css" rel="stylesheet">
</head>

<body>

<header class="navbar">

<a href="/" class="logo">RUMİ7XL</a>

<nav class="nav-links">
<a href="/">Ana Sayfa</a>
<a href="topluluk.html">Topluluk</a>
<a href="oneriler.html">Öneriler</a>
<a href="icerikler.html">İçerikler</a>
<a href="duyurular.html">Duyurular</a>
</nav>

<div class="account-box" id="accountBox">
<a href="#" class="login-btn">👤 Giriş Yap</a>
<a href="#" class="register-btn">✨ Kayıt Ol</a>
</div>

</header>


<!-- mevcut içeriklerin buraya gelecek -->


<div class="account-modal" id="accountModal">

<div class="account-window">

<button class="close-account" onclick="closeAccount()">✕</button>

<div class="account-tabs">
<button id="loginTab" class="active">Giriş Yap</button>
<button id="registerTab">Kayıt Ol</button>
</div>


<div id="loginForm" class="account-form">

<input id="loginEmail" type="email" placeholder="E-posta">

<input id="loginPassword" type="password" placeholder="Şifre">

<button id="loginBtn" class="account-submit">Giriş Yap</button>

</div>


<div id="registerForm" class="account-form" style="display:none;">

<input id="registerUsername" type="text" placeholder="Kullanıcı adı">

<input id="registerEmail" type="email" placeholder="E-posta">

<input id="registerPassword" type="password" placeholder="Şifre">

<button id="registerBtn" class="account-submit">Kayıt Ol</button>

</div>

</div>
</div>


<script>
const modal=document.getElementById("accountModal");

document.querySelector(".login-btn").onclick=e=>{
e.preventDefault();
showLogin();
modal.style.display="flex";
};

document.querySelector(".register-btn").onclick=e=>{
e.preventDefault();
showRegister();
modal.style.display="flex";
};

function showLogin(){
loginForm.style.display="flex";
registerForm.style.display="none";
loginTab.classList.add("active");
registerTab.classList.remove("active");
}

function showRegister(){
loginForm.style.display="none";
registerForm.style.display="flex";
registerTab.classList.add("active");
loginTab.classList.remove("active");
}

function closeAccount(){
modal.style.display="none";
}
</script>


<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig={
apiKey:"AIzaSyCiuXtHu3J9Va46a4KiETO2JrSn5um2KoQ",
authDomain:"rumi7xl-web.firebaseapp.com",
projectId:"rumi7xl-web",
storageBucket:"rumi7xl-web.firebasestorage.app",
messagingSenderId:"1077565304835",
appId:"1:1077565304835:web:a672a4440797b76f42de36"
};


const app=initializeApp(firebaseConfig);
const auth=getAuth(app);


loginBtn.onclick=async()=>{

try{

await signInWithEmailAndPassword(
auth,
loginEmail.value,
loginPassword.value
);

alert("Giriş başarılı");

}catch(e){

alert(e.message);

}

};


registerBtn.onclick=async()=>{

try{

await createUserWithEmailAndPassword(
auth,
registerEmail.value,
registerPassword.value
);

alert("Hesap oluşturuldu");

}catch(e){

alert(e.message);

}

};


onAuthStateChanged(auth,user=>{

const box=document.getElementById("accountBox");

if(user){

box.innerHTML=`
<a>👤 ${user.email.split("@")[0]}</a>
<a href="#" id="logoutBtn">🚪 Çıkış Yap</a>
`;

logoutBtn.onclick=e=>{
e.preventDefault();
signOut(auth);
};

}

});


</script>

</body>
</html>
