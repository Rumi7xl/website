<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUMİ7XL | Topluluk</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
<a href="/" class="logo">RUMİ7XL</a>
<nav class="nav-links">
  <a href="/">Ana Sayfa</a>
  <a href="topluluk.html">Topluluk</a>
  <a href="oneriler.html">Öneriler</a>
  <a href="icerikler.html">İçerikler</a>
  <a href="duyurular.html">Duyurular</a>
</nav>
<div class="account-box">
  <a href="#" class="login-btn">👤 Giriş Yap</a>
  <a href="#" class="register-btn">✨ Kayıt Ol</a>
</div>
</header>

<section class="community">
<h1>RUMİ7XL Topluluk</h1>
<p>Burada herkes sohbet edebilir, fikirlerini paylaşabilir.</p>

<div class="chat-box">
  <div class="message"><b>👤 RUMİ7XL</b><span>Hoş geldiniz millet 👋</span></div>
  <div class="message"><b>👤 Kullanıcı</b><span>Selam herkese 🔥</span></div>
</div>

<div class="chat-input">
  <input type="text" placeholder="Mesajını yaz...">
  <button>Gönder</button>
</div>
</section>

<!-- HESAP POPUP -->
<div class="account-modal" id="accountModal">
<div class="account-window">
<button class="close-account" onclick="closeAccount()">✕</button>

<div class="account-tabs">
<button id="loginTab" class="active" onclick="showLogin()">Giriş Yap</button>
<button id="registerTab" onclick="showRegister()">Kayıt Ol</button>
</div>

<form id="loginForm" class="account-form" autocomplete="on">
<input type="email" name="email" placeholder="E-posta" autocomplete="username">
<input type="password" name="password" placeholder="Şifre" autocomplete="current-password">
<button type="submit" class="account-submit">Giriş Yap</button>
</form>

<form id="registerForm" class="account-form" style="display:none;" autocomplete="on">
<input type="text" name="username" placeholder="Kullanıcı adı" autocomplete="username">
<input type="email" name="register-email" placeholder="E-posta" autocomplete="email">
<input type="password" name="new-password" placeholder="Şifre" autocomplete="new-password">
<button type="submit" class="account-submit">Kayıt Ol</button>
</form>

</div>
</div>

<script>
function showLogin(){
document.getElementById("loginForm").style.display="flex";
document.getElementById("registerForm").style.display="none";
document.getElementById("loginTab").classList.add("active");
document.getElementById("registerTab").classList.remove("active");
}

function showRegister(){
document.getElementById("loginForm").style.display="none";
document.getElementById("registerForm").style.display="flex";
document.getElementById("registerTab").classList.add("active");
document.getElementById("loginTab").classList.remove("active");
}

function closeAccount(){
document.getElementById("accountModal").style.display="none";
}

window.showLogin = showLogin;
window.showRegister = showRegister;
window.closeAccount = closeAccount;
</script>

<script type="module" src="auth.js"></script>
</body>
</html>
