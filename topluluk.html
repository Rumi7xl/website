<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUMİ7XL | Topluluk</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>

<header class="navbar">
<a href="/" class="logo">RUMİ7XL</a>
<nav class="nav-links">
  <a href="/">Ana Sayfa</a>
  <a href="topluluk.html" class="active">Topluluk</a>
  <a href="oneriler.html">Öneriler</a>
  <a href="icerikler.html">İçerikler</a>
  <a href="duyurular.html">Duyurular</a>
</nav>
<div class="account-box">
  <a href="#" class="login-btn" onclick="openAccountModal('login'); return false;">👤 Giriş Yap</a>
  <a href="#" class="register-btn" onclick="openAccountModal('register'); return false;">✨ Kayıt Ol</a>
</div>
</header>

<section class="community">
<h1 style="margin: 0 0 4px 0; font-size: 1.6rem;">RUMİ7XL Topluluk</h1>
<p style="margin: 0 0 12px 0; color: #aaa; font-size: 0.85rem;">Burada herkes sohbet edebilir, fikirlerini paylaşabilir.</p>

<div class="chat-box" id="chatBox">
  <div class="message">
    <b>👤 RUMİ7XL System</b>
    <span>Sohbet odası yüklendi! İlk mesajı sen at 👋</span>
  </div>
</div>

<form id="chatForm" class="chat-input" onsubmit="return false;">
  <input type="text" id="chatInput" placeholder="Mesajını yaz..." autocomplete="off">
  <button type="button" id="sendMessageBtn">Gönder</button>
</form>
</section>

<!-- HESAP POPUP -->
<div class="account-modal" id="accountModal" style="display:none;">
<div class="account-window">
<button class="close-account" onclick="closeAccount()">✕</button>

<div class="account-tabs">
<button id="loginTab" class="active" onclick="showLogin()">Giriş Yap</button>
<button id="registerTab" onclick="showRegister()">Kayıt Ol</button>
</div>

<form id="loginForm" class="account-form" autocomplete="on">
<input type="email" name="email" placeholder="E-posta" autocomplete="username" required>
<input type="password" name="password" placeholder="Şifre" autocomplete="current-password" required>

<div style="text-align: right; width: 100%; margin-top: -5px; margin-bottom: 5px;">
  <a href="#" id="forgotPasswordBtn" style="color: #a855f7; font-size: 0.85rem; text-decoration: none;">Şifremi Unuttum?</a>
</div>

<button type="submit" class="account-submit">Giriş Yap</button>
</form>

<form id="registerForm" class="account-form" style="display:none;" autocomplete="on">
<input type="text" name="username" placeholder="Kullanıcı adı" autocomplete="username" required>
<input type="email" name="register-email" placeholder="E-posta" autocomplete="email" required>
<input type="password" name="new-password" placeholder="Şifre" autocomplete="new-password" required>
<button type="submit" class="account-submit">Kayıt Ol</button>
</form>
</div>
</div>

<!-- PROFİL FOTOĞRAFI POPUP -->
<div class="settings-modal" id="photoModal" style="display:none;">
  <div class="settings-window">
    <button class="close-account" onclick="document.getElementById('photoModal').style.display='none'">✕</button>
    <h2>🖼️ Profil Fotoğrafı</h2>
    
    <form id="photoSettingsForm">
      <label for="photoFileInput" class="custom-file-upload">
        <span id="uploadLabelText" style="color:#aaa; font-size:0.9rem;">📁 Cihazdan / Galeriden Resim Seç</span>
        <img id="photoPreview" class="preview-avatar" src="" alt="Önizleme" style="display:none;">
      </label>
      <input type="file" id="photoFileInput" accept="image/*" required style="display: none;">
      
      <button type="submit" class="settings-btn" style="margin-top: 15px;">Fotoğrafı Yükle ve Kaydet</button>
    </form>
  </div>
</div>

<!-- ŞİFRE DEĞİŞTİRME POPUP -->
<div class="settings-modal" id="passwordModal" style="display:none;">
  <div class="settings-window">
    <button class="close-account" onclick="document.getElementById('passwordModal').style.display='none'">✕</button>
    <h2>🔑 Şifre Değiştir</h2>
    
    <form id="passwordSettingsForm" autocomplete="off">
      <label style="color:#aaa; font-size:0.85rem; display:block; text-align:left; margin-bottom:5px;">Yeni Şifreniz:</label>
      <input type="password" name="changePassword" placeholder="Yeni Şifreniz" required autocomplete="new-password">
      <button type="submit" class="settings-btn">Şifreyi Güncelle</button>
    </form>
  </div>
</div>

<script>
function showLogin(){
  document.getElementById("loginForm").style.display="flex";
  document.getElementById("registerForm").style.display="none";
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");
}

function showRegister(){
  document.getElementById("loginForm").style.display="none";
  document.getElementById("registerForm").style.display="flex";
  document.getElementById("registerTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
}

function openAccountModal(type) {
  const modal = document.getElementById("accountModal");
  if (modal) {
    modal.style.display = "flex";
    if (type === 'register') {
      showRegister();
    } else {
      showLogin();
    }
  }
}

function closeAccount(){
  document.getElementById("accountModal").style.display="none";
}

window.showLogin = showLogin;
window.showRegister = showRegister;
window.openAccountModal = openAccountModal;
window.closeAccount = closeAccount;
</script>

<script type="module" src="auth.js?v=1.5"></script>

<!-- CANLI SOHBET SCRIPT (FIRESTORE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  orderBy, 
  onSnapshot, 
  limit,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiuXtHu3J9Va46a4KiETO2JrSn5um2KoQ",
  authDomain: "rumi7xl-web.firebaseapp.com",
  projectId: "rumi7xl-web",
  storageBucket: "rumi7xl-web.firebasestorage.app",
  messagingSenderId: "1077565304835",
  appId: "1:1077565304835:web:a672a4440797b76f42de36"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendMessageBtn");

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!user) {
    chatInput.placeholder = "Mesaj yazmak için giriş yapmalısın...";
  } else {
    chatInput.placeholder = "Mesajını yaz...";
  }
});

const messagesRef = collection(db, "messages");
const q = query(messagesRef, orderBy("createdAt", "asc"), limit(50));

onSnapshot(q, (snapshot) => {
  chatBox.innerHTML = "";
  
  if (snapshot.empty) {
    chatBox.innerHTML = `
      <div class="message">
        <b>👤 RUMİ7XL System</b>
        <span>Henüz mesaj yok, ilk mesajı sen at! 🔥</span>
      </div>`;
    return;
  }

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const messageDiv = document.createElement("div");
    
    const isMe = currentUser && data.uid === currentUser.uid;
    messageDiv.className = isMe ? "message my-message" : "message";
    
    const cleanUser = escapeHtml(data.username || "Kullanıcı");
    const cleanText = escapeHtml(data.text || "");
    const userPhoto = data.photoURL || "https://api.dicebear.com/7.x/bottts/svg?seed=" + encodeURIComponent(cleanUser);

    const justifyStyle = isMe ? 'flex-end' : 'flex-start';

    messageDiv.innerHTML = `
      <div class="chat-user-header" style="justify-content: ${justifyStyle};">
        ${!isMe ? `<img src="${userPhoto}" class="chat-user-avatar">` : ''}
        <b style="font-size: 0.85rem; color: ${isMe ? '#c084fc' : '#9146ff'};">${cleanUser}</b>
        ${isMe ? `<img src="${userPhoto}" class="chat-user-avatar">` : ''}
      </div>
      <span style="font-size: 0.95rem; color: #fff; word-break: break-word;">${cleanText}</span>
    `;
    chatBox.appendChild(messageDiv);
  });

  chatBox.scrollTop = chatBox.scrollHeight;
}, (err) => {
  console.error("Firestore Dinleme Hatası:", err);
});

async function sendMessage() {
  if (!currentUser) {
    window.openAccountModal('login');
    return;
  }

  const text = chatInput.value.trim();
  if (!text) return;

  const username = currentUser.displayName || currentUser.email.split("@")[0];
  let photoURL = currentUser.photoURL || "https://api.dicebear.com/7.x/bottts/svg?seed=" + encodeURIComponent(username);

  try {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists() && userDoc.data().photoURL) {
      photoURL = userDoc.data().photoURL;
    }
  } catch(e) {}

  try {
    chatInput.value = "";
    await addDoc(messagesRef, {
      text: text,
      username: username,
      photoURL: photoURL,
      uid: currentUser.uid,
      createdAt: Date.now()
    });
  } catch (err) {
    console.error("Mesaj gönderilemedi:", err);
    alert("Mesaj gönderilemedi: " + err.message);
  }
}

if (sendBtn) sendBtn.onclick = sendMessage;

if (chatInput) {
  chatInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.innerText = text;
  return div.innerHTML;
}
</script>

</body>
</html>
