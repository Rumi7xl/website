<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUMİ7XL | Topluluk</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
<a href="/" class="logo">RUMİ7XL</a>
<nav class="nav-links">
  <a href="/">Ana Sayfa</a>
  <a href="topluluk.html">Topluluk</a>
  <a href="oneriler.html">Öneriler</a>
  <a href="icerikler.html">İçerikler</a>
  <a href="duyurular.html">Duyurular</a>
</nav>
<div class="account-box">
  <a href="#" class="login-btn">👤 Giriş Yap</a>
  <a href="#" class="register-btn">✨ Kayıt Ol</a>
</div>
</header>

<section class="community">
<h1>RUMİ7XL Topluluk</h1>
<p>Burada herkes sohbet edebilir, fikirlerini paylaşabilir.</p>

<div class="chat-box" id="chatBox">
  <div class="message">
    <b>👤 RUMİ7XL System</b>
    <span>Sohbet odası yüklendi! İlk mesajı sen at 👋</span>
  </div>
</div>

<form id="chatForm" class="chat-input" onsubmit="return false;">
  <input type="text" id="chatInput" placeholder="Mesajını yaz..." autocomplete="off">
  <button type="button" id="sendMessageBtn">Gönder</button>
</form>
</section>

<!-- HESAP POPUP (GİRİŞ / KAYIT) -->
<div class="account-modal" id="accountModal">
<div class="account-window">
<button class="close-account" onclick="closeAccount()">✕</button>

<div class="account-tabs">
<button id="loginTab" class="active" onclick="showLogin()">Giriş Yap</button>
<button id="registerTab" onclick="showRegister()">Kayıt Ol</button>
</div>

<form id="loginForm" class="account-form" autocomplete="on">
<input type="email" name="email" placeholder="E-posta" autocomplete="username">
<input type="password" name="password" placeholder="Şifre" autocomplete="current-password">

<!-- YENİ ŞİFREMİ UNUTTUM LINKI -->
<div style="text-align: right; width: 100%; margin-top: -5px; margin-bottom: 5px;">
  <a href="#" id="forgotPasswordBtn" style="color: #a855f7; font-size: 0.85rem; text-decoration: none;">Şifremi Unuttum?</a>
</div>

<button type="submit" class="account-submit">Giriş Yap</button>
</form>

<form id="registerForm" class="account-form" style="display:none;" autocomplete="on">
<input type="text" name="username" placeholder="Kullanıcı adı" autocomplete="username">
<input type="email" name="register-email" placeholder="E-posta" autocomplete="email">
<input type="password" name="new-password" placeholder="Şifre" autocomplete="new-password">
<button type="submit" class="account-submit">Kayıt Ol</button>
</form>

</div>
</div>

<!-- PROFİL AYARLARI POPUP -->
<div class="settings-modal" id="settingsModal">
  <div class="settings-window">
    <button class="close-account" onclick="document.getElementById('settingsModal').style.display='none'">✕</button>
    <h2>⚙️ Profil Ayarları</h2>
    
    <form id="profileSettingsForm">
      <label style="color:#aaa; font-size:0.85rem; display:block; text-align:left; margin-bottom:5px;">Profil Fotoğrafı URL (Resim Bağlantısı):</label>
      <input type="url" name="photoUrl" placeholder="https://resim-linki.com/foto.jpg">
      
      <label style="color:#aaa; font-size:0.85rem; display:block; text-align:left; margin-bottom:5px; margin-top:10px;">Yeni Şifre (Değiştirmek İstemiyorsan Boş Bırak):</label>
      <input type="password" name="newPassword" placeholder="Yeni Şifreniz">
      
      <button type="submit" class="settings-btn">Kaydet ve Güncelle</button>
    </form>
  </div>
</div>

<script>
function showLogin(){
document.getElementById("loginForm").style.display="flex";
document.getElementById("registerForm").style.display="none";
document.getElementById("loginTab").classList.add("active");
document.getElementById("registerTab").classList.remove("active");
}

function showRegister(){
document.getElementById("loginForm").style.display="none";
document.getElementById("registerForm").style.display="flex";
document.getElementById("registerTab").classList.add("active");
document.getElementById("loginTab").classList.remove("active");
}

function closeAccount(){
document.getElementById("accountModal").style.display="none";
}

window.showLogin = showLogin;
window.showRegister = showRegister;
window.closeAccount = closeAccount;
</script>

<script type="module" src="auth.js"></script>

<!-- CANLI SOHBET SCRIPT (FIRESTORE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  addDoc, 
  query, 
  orderBy, 
  onSnapshot, 
  limit 
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiuXtHu3J9Va46a4KiETO2JrSn5um2KoQ",
  authDomain: "rumi7xl-web.firebaseapp.com",
  projectId: "rumi7xl-web",
  storageBucket: "rumi7xl-web.firebasestorage.app",
  messagingSenderId: "1077565304835",
  appId: "1:1077565304835:web:a672a4440797b76f42de36"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendMessageBtn");

let currentUser = null;

// Oturum Durumu Takibi
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!user) {
    chatInput.placeholder = "Mesaj yazmak için giriş yapmalısın...";
  } else {
    chatInput.placeholder = "Mesajını yaz...";
  }
});

// Firestore'dan Canlı Mesaj Çekme
const messagesRef = collection(db, "messages");
const q = query(messagesRef, orderBy("createdAt", "asc"), limit(50));

onSnapshot(q, (snapshot) => {
  chatBox.innerHTML = "";
  
  if (snapshot.empty) {
    chatBox.innerHTML = `
      <div class="message">
        <b>👤 RUMİ7XL System</b>
        <span>Henüz mesaj yok, ilk mesajı sen at! 🔥</span>
      </div>`;
    return;
  }

  snapshot.forEach((doc) => {
    const data = doc.data();
    const messageDiv = document.createElement("div");
    
    const isMe = currentUser && data.uid === currentUser.uid;
    messageDiv.className = isMe ? "message my-message" : "message";
    
    const cleanUser = escapeHtml(data.username || "Kullanıcı");
    const cleanText = escapeHtml(data.text || "");

    messageDiv.innerHTML = `
      <b style="display: block; font-size: 0.85rem; color: ${isMe ? '#c084fc' : '#9146ff'}; margin-bottom: 4px;">👤 ${cleanUser}</b>
      <span style="font-size: 0.95rem; color: #fff;">${cleanText}</span>
    `;
    chatBox.appendChild(messageDiv);
  });

  chatBox.scrollTop = chatBox.scrollHeight;
}, (err) => {
  console.error("Firestore Dinleme Hatası:", err);
});

// Mesaj Gönderme İşlemi
async function sendMessage() {
  if (!currentUser) {
    document.getElementById("accountModal").style.display = "flex";
    return;
  }

  const text = chatInput.value.trim();
  if (!text) return;

  const username = currentUser.displayName || currentUser.email.split("@")[0];

  try {
    chatInput.value = "";
    await addDoc(messagesRef, {
      text: text,
      username: username,
      uid: currentUser.uid,
      createdAt: Date.now()
    });
  } catch (err) {
    console.error("Mesaj gönderilemedi:", err);
    alert("Mesaj gönderilemedi: " + err.message);
  }
}

// Butona Tıklama
if (sendBtn) {
  sendBtn.onclick = sendMessage;
}

// Enter Tuşuna Basma
if (chatInput) {
  chatInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.innerText = text;
  return div.innerHTML;
}
</script>

</body>
</html>
