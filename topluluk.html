<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUMİ7XL - Topluluk</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* SOHBET KUTUSU VE CHAT MANTIĞI */
    .chat-container {
      max-width: 800px;
      margin: 30px auto;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      height: 600px;
      box-shadow: 0 0 30px rgba(145, 70, 255, 0.15);
      overflow: hidden;
    }
    
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ÖZEL ŞIK SCROLLBAR (BEYAZ YAPIYI YOK ETMEK İÇİN) */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }
    .chat-messages::-webkit-scrollbar-track {
      background: #0d0d0d;
    }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 10px;
    }
    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #9146ff;
    }

    /* GENEL MESAJ KUTUSU STİLİ */
    .chat-msg {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 75%;
    }

    /* BAŞKASININ MESAJI (SOLDA) */
    .chat-msg.other-msg {
      align-self: flex-start;
      flex-direction: row;
    }
    .chat-msg.other-msg .msg-bubble {
      background: #181818;
      border: 1px solid #282828;
      border-bottom-left-radius: 4px;
      color: #ddd;
    }

    /* SENİN MESAJIN (SAĞDA) */
    .chat-msg.my-msg {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .chat-msg.my-msg .msg-bubble {
      background: linear-gradient(135deg, #7c2ae8, #9146ff);
      border-bottom-right-radius: 4px;
      color: white;
      box-shadow: 0 0 15px rgba(145, 70, 255, 0.3);
    }
    .chat-msg.my-msg .msg-header {
      justify-content: flex-end;
    }
    .chat-msg.my-msg .msg-username {
      color: #e9d5ff;
    }
    .chat-msg.my-msg .msg-time {
      color: rgba(255, 255, 255, 0.7);
    }

    /* MESAJ BALONCUĞU */
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .msg-username {
      font-weight: bold;
      font-size: 13px;
    }
    .msg-time {
      font-size: 10px;
      color: #777;
    }

    .chat-msg img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 2px solid #9146ff;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* INPUT ALANI */
    .chat-input-area {
      padding: 15px 20px;
      background: #141414;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
    }
    .chat-input-area input {
      flex: 1;
      background: #090909;
      border: 1px solid #333;
      border-radius: 25px;
      padding: 12px 20px;
      color: white;
      outline: none;
      font-size: 14px;
    }
    .chat-input-area button {
      background: #9146ff;
      color: white;
      border: none;
      padding: 0 25px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(145,70,255,0.4);
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="logo">RUMİ7XL</a>
    
    <div class="nav-links">
      <a href="index.html">Ana Sayfa</a>
      <a href="topluluk.html" class="active">Topluluk</a>
      <a href="oneriler.html">Öneriler</a>
      <a href="icerikler.html">İçerikler</a>
      <a href="duyurular.html">Duyurular</a>
    </div>

    <div class="account-box"></div>
  </nav>

  <div style="padding: 0 20px;">
    <h1 style="font-size: 40px; color: #9146ff; text-align: center; text-shadow: 0 0 20px #9146ff; margin-top: 30px; margin-bottom: 5px;">
      RUMİ7XL Topluluk
    </h1>
    <p style="color: #aaa; text-align: center; font-size: 15px; margin-bottom: 20px;">
      Burada herkes sohbet edebilir, fikirlerini paylaşabilir.
    </p>

    <!-- CANLI SOHBET ALANI -->
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <p style="color:#aaa; text-align:center;">Sohbet yükleniyor...</p>
      </div>

      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Mesajını yaz..." autocomplete="off">
        <button id="sendChatBtn">Gönder</button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 RUMİ7XL - Tüm Hakları Saklıdır.</p>
  </footer>

  <!-- MODALLAR -->
  <div id="accountModal" class="account-modal">
    <div class="account-window">
      <button class="close-account" onclick="document.getElementById('accountModal').style.display='none'">✕</button>
      <div class="account-tabs">
        <button id="loginTabBtn" class="active" onclick="switchTab('login')">Giriş Yap</button>
        <button id="registerTabBtn" onclick="switchTab('register')">Kayıt Ol</button>
      </div>
      <form id="loginForm" class="account-form">
        <input type="email" name="email" placeholder="E-posta" required>
        <input type="password" name="password" placeholder="Şifre" required>
        <button type="submit" class="account-submit">Giriş Yap</button>
      </form>
      <form id="registerForm" class="account-form" style="display:none;">
        <input type="text" name="username" placeholder="Kullanıcı Adı" required>
        <input type="email" name="register-email" placeholder="E-posta" required>
        <input type="password" name="new-password" placeholder="Şifre" required>
        <button type="submit" class="account-submit">Kayıt Ol</button>
      </form>
    </div>
  </div>

  <div id="photoModal" class="account-modal">
    <div class="account-window">
      <button class="close-account" onclick="document.getElementById('photoModal').style.display='none'">✕</button>
      <h2 style="color:#9146ff; margin-bottom:15px; font-size:20px; text-align:center;">Profil Fotoğrafı Değiştir</h2>
      <form id="photoSettingsForm" class="account-form">
        <label for="photoFileInput" style="border: 2px dashed #333; padding: 20px; text-align: center; border-radius: 15px; cursor: pointer; display: block; background: #181818;">
          <span id="uploadLabelText">📁 Galeriden Resim Seç</span>
          <input type="file" id="photoFileInput" accept="image/*" style="display:none;">
          <img id="photoPreview" style="display:none; width:80px; height:80px; border-radius:50%; margin: 10px auto 0; object-fit:cover; border:2px solid #9146ff;">
        </label>
        <button type="submit" class="account-submit">Yükle ve Kaydet</button>
      </form>
    </div>
  </div>

  <div id="passwordModal" class="account-modal">
    <div class="account-window">
      <button class="close-account" onclick="document.getElementById('passwordModal').style.display='none'">✕</button>
      <h2 style="color:#9146ff; margin-bottom:15px; font-size:20px; text-align:center;">Şifre Değiştir</h2>
      <form id="passwordSettingsForm" class="account-form">
        <input type="password" name="changePassword" placeholder="Yeni Şifreniz" required>
        <button type="submit" class="account-submit">Şifreyi Güncelle</button>
      </form>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
  <script type="module" src="community.js"></script>
</body>
</html>
